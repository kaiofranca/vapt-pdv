# Configuração do Orquestrador BMAD Loop para o projeto VaptPDV
# Gerencia a execução autônoma de stories (bmad-build-auto, bmad-review e bmad-loop-sweep)

[project]
name = "vapt-pdv"
spec_dir = "_bmad-output/specs/spec-vapt-pdv"
sprint_status = "_bmad-output/implementation-artifacts/sprint-status.yaml"

[adapter]
name = "antigravity"

[loop]
max_attempts_per_story = 3
require_clean_worktree = false
run_verification_commands = [
  "npm --prefix backend run typecheck",
  "npm --prefix backend test",
  "npm --prefix frontend run build"
]

